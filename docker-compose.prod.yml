services:
  postgres:
    image: postgres:16-alpine
    container_name: struyen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-struyen}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-struyen}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - struyen-network

  redis:
    image: redis:7-alpine
    container_name: struyen-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - struyen-network

  backend:
    image: ${IMAGE_BACKEND:-ghcr.io/baodang69/struyen-be:latest}
    container_name: struyen-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-struyen}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:?Admin secret key required}
      JWT_SECRET: ${JWT_SECRET:?JWT secret key required}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-true}
      JWT_COOKIE_SAME_SITE: ${JWT_COOKIE_SAME_SITE:-Lax}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - struyen-network

  frontend:
    image: ${IMAGE_FRONTEND:-ghcr.io/baodang69/komika-fe:latest}
    container_name: struyen-frontend
    restart: unless-stopped
    environment:
      INTERNAL_API_BASE_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - struyen-network

  nginx:
    image: nginx:1.27-alpine
    container_name: struyen-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - struyen-network

  # Auto-update container: polls GHCR and automatically restarts backend/frontend when a new image is pushed
  watchtower:
    image: containrrr/watchtower:latest
    container_name: struyen-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_PATH:-/root/.docker/config.json}:/config.json:ro
    environment:
      WATCHTOWER_POLL_INTERVAL: 300
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_SCOPE: "struyen"
    networks:
      - struyen-network

  # Cloudflare Tunnel: Exposes Nginx securely to the internet without port forwarding
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: struyen-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Cloudflare Tunnel token required}
    depends_on:
      - nginx
    networks:
      - struyen-network

volumes:
  postgres_data:
  redis_data:
  nginx_cache:

networks:
  struyen-network:
    driver: bridge

