events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # DNS resolver for upstream dynamic resolution
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

    upstream backend_upstream {
        server backend:8080;
        keepalive 32;
    }

    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 20M;

        # Clean Static Proxy for MangaDex Covers
        location /mangadex/covers/ {
            proxy_pass https://uploads.mangadex.org/covers/;
            proxy_set_header Referer "https://mangadex.org";
            proxy_set_header User-Agent "StruyenReader/1.0 (https://github.com/struyen/struyen_be; contact@struyen.com)";
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # Clean Static Proxy for MangaDex Chapter Pages (*.mangadex.network)
        location ~ ^/mangadex/network/([^/]+)/(.*)$ {
            set $target_node $1;
            set $target_path $2;
            proxy_pass https://$target_node/$target_path;
            proxy_set_header Referer "https://mangadex.org";
            proxy_set_header User-Agent "StruyenReader/1.0 (https://github.com/struyen/struyen_be; contact@struyen.com)";
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # Legacy Image Proxy Endpoint (Chuyen tiep qua Backend, khong ghi dia cuc bo)
        location /api/v1/proxy/image {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # Backend REST API Endpoints
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Backend Actuator Endpoints (Health check)
        location /actuator/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Next.js Static Assets Caching
        location /_next/static/ {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Frontend Next.js SSR / Pages
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}

